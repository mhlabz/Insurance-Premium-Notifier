{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><p class="eyebrow">POLICY MANAGEMENT</p><h1>{{ 'Edit Policy' if policy else 'Add Policy' }}</h1><p class="muted">Enter policyholder and premium schedule information.</p></div></div><form class="panel formgrid" method="post"><label>Policy number *<input name="policy_number" required value="{{ policy.policy_number if policy else '' }}"></label><label>Policyholder name *<input name="customer_name" required value="{{ policy.customer_name if policy else '' }}"></label><label>Email<input type="email" name="customer_email" value="{{ policy.customer_email if policy else '' }}"></label><label>Phone number<input name="customer_phone" value="{{ policy.customer_phone if policy else '' }}"></label><label>Premium amount (INR) *<input type="number" min="0.01" step="0.01" name="premium_amount" required value="{{ policy.premium_amount if policy else '' }}"></label><label>Payment frequency *<select name="frequency"><option value="monthly" {% if policy and policy.frequency=='monthly' %}selected{% endif %}>Monthly</option><option value="yearly" {% if policy and policy.frequency=='yearly' %}selected{% endif %}>Yearly</option></select></label><label>Policy start date *<input type="date" name="start_date" required value="{{ policy.start_date if policy else today.isoformat() }}"></label><label>Last payment date *<input type="date" name="last_payment_date" required value="{{ policy.last_payment_date if policy else today.isoformat() }}"></label><label>Grace period (days) *<input type="number" min="0" name="grace_period" required value="{{ policy.grace_period if policy else 30 }}"></label><div class="formactions"><button type="submit">{{ 'Save Changes' if policy else 'Create Policy' }}</button><a class="button secondary" href="{{ url_for('all_policies') }}">Cancel</a></div></form>{% endblock %}
